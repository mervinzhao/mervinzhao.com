# Photo crops. Run `npm run photos` locally (originals live in photos-original/,
# which is gitignored). Outputs WebP + AVIF at each width, metadata stripped.
# `aspect` is width/height of the slot; `focus` is the focal point in percent
# (x, y) used to place the crop when the source aspect differs.
# Optional `quality: { avif, webp }` overrides the defaults (52 and 78). The two
# scales differ: AVIF 64 looks about like WebP 80.
hero:
  src: 3 (1 of 1).jpg
  alt: Long-exposure photo of a turquoise glacial river cascading over dark rock toward snowy hills at sunset
  aspect: 0.6667   # 412 × 618
  focus: [50, 50]
  # Long exposure: fine water and rock detail, so a 2048 px top size for 4K/5K panels
  # and lighter compression (~500 KB at 2048).
  widths: [412, 824, 1236, 1648, 2048]
  quality: { avif: 75, webp: 85 }
band:
  src: 1__1_of_1_.jpg
  alt: Long-exposure fog flowing over a forested ridge at dusk, with house lights glowing through
  aspect: 1.5259   # 412 × 270
  focus: [50, 50]
  widths: [412, 824, 1236]
portrait:
  src: headshot.jpg
  alt: Mervin Zhao
  aspect: 1
  zoom: 0.66     # head and shoulders
  focus: [49, 49]
  widths: [160, 288]
# Embedded in the downloadable vCard (base64), so kept small.
vcard:
  src: headshot.jpg
  alt: Mervin Zhao
  aspect: 1
  zoom: 0.66
  focus: [49, 49]
  widths: [240]
  formats: [jpg]
# Link previews (Open Graph): 1.91:1, JPEG for the widest support.
og:
  src: 1__1_of_1_.jpg
  alt: Long-exposure fog flowing over a forested ridge at dusk, with house lights glowing through
  aspect: 1.905
  focus: [45, 50]
  widths: [1200]
  formats: [jpg]

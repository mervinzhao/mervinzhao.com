experience:
  - org: renphil
    role: Assistant Director, ASCENT Program
    start: "2026-09"
    highlights:
      - >-
        Train and mentor technical staff supporting ASCENT (Japan-based) and
        ARIA (UK) in ARPA-model program design, technical diligence, and
        portfolio management.
      - >-
        Stand up the ASCENT program office, including portfolio tracking,
        review workflows, reporting, and a reusable framework defining support
        staff roles.
      - >-
        Standardize ARPA-model program assets for reuse across program areas,
        and support proposal reviews and award negotiations.
  - org: bah
    role: Lead Engineer, Tech SETA at ARPA-E
    start: "2023-02"
    end: "2026-08"
    summary: >-
      Technical consulting for the U.S. Department of Energy to forecast and
      guide future energy technologies.
    highlights:
      - >-
        Scout and develop new program areas in critical minerals, geologic
        hydrogen, AI for materials science, and advanced materials and
        manufacturing.
      - >-
        Draft funding opportunities and requests for information documents to
        set priorities for technology innovation, develop workshop programming
        to engage industry networks, and assist in the negotiations of awarded
        funds.
      - >-
        Provide active technical and commercialization project management for
        advanced energy applications.
  - org: spectech
    role: Fellow
    start: "2025-01"
    end: "2025-05"
    summary: >-
      Develop and pitch a program surrounding synthetic conductors to replace
      traditional metals.
  - org: newlab
    role: Technical Advisor
    start: "2022-12"
    end: "2025-01"
    summary: >-
      Provide materials science subject matter expertise for due diligence on
      start-up technologies.
  - org: 4cair
    role: Director of Research and Development
    start: "2017-11"
    end: "2023-01"
    summary: >-
      Directly reported to the CEO and led global R&D efforts for nanofiber
      technologies. Founded by Stanford University Professors Steven Chu and
      Yi Cui.
    highlights:
      - Directed research spanning formulation, nanofiber processing, roll-to-roll production, and handling.
      - >-
        Managed product development, patents, competitor analysis, and
        launches in personal respirators, HVAC media, waterproof membranes,
        and biodegradable media.
      - Developed and launched the world’s first biodegradable N95-level filtration material.
      - Served as a subject matter expert on air filtration and lead author with the CDC and WHO for COVID.


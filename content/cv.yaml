about:
  # Placeholder copy. Mervin will rewrite.
  lead: >-
    I evaluate emerging technology in industrial sectors and advanced energy
    systems, and help design the programs that fund it.
  body: >-
    Five years of start-up experience, including leading global R&D at 4C Air,
    followed by technical advisory work for ARPA-E and the venture community.
    Trained in applied physics and materials science at UC Berkeley.
  summary: >-
    Proven track record of evaluating emerging technology trends in industrial
    sectors and advanced energy systems. Extensive network within the venture
    and start-up communities through 5 years of start-up experience and
    technical advisory roles. Experienced in managing global R&D teams and
    pitching strategic innovation programs to leadership.
  focus:
    - Critical minerals
    - Geologic hydrogen
    - AI for materials science
    - Advanced materials and manufacturing
    - ARPA-model program design

